<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Karyawan - MM PUTRA MOTOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .hidden-view { display: none !important; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-radius: 50%; border-top: 4px solid #0284c7; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .luxury-border { border: 1px solid #e0f2fe; box-shadow: 0 4px 20px -2px rgba(2, 132, 199, 0.05); border-top: 3px solid #0284c7; }
        .luxury-input { border: 1px solid #7dd3fc; transition: all 0.3s ease; }
        .luxury-input:focus { box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); border-color: #0284c7; outline: none;}
    </style>
</head>
<body class="bg-[#fdfbfb] text-gray-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- OVERLAY LOADING -->
    <div id="loading-overlay" class="fixed inset-0 bg-neutral-900 bg-opacity-90 z-[100] hidden-view flex flex-col justify-center items-center text-white backdrop-blur-md transition-opacity">
        <div class="spinner mb-4"></div>
        <p id="loading-text" class="text-lg font-light tracking-widest text-sky-200">MEMPROSES DATA...</p>
    </div>

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="bg-white rounded-3xl luxury-border p-6 md:p-10 w-full max-w-xl shadow-2xl fade-in relative overflow-hidden">
        <div class="text-center mb-8 border-b border-sky-100 pb-6">
            <div class="flex justify-center mb-4">
                <img src="https://cdn.phototourl.com/free/2026-07-21-6b299418-311e-4ffb-bc13-ad766cd8455a.png" alt="Logo Perusahaan" class="h-20 w-auto object-contain drop-shadow-md">
            </div>
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-900 to-sky-600">PORTAL KARYAWAN</h2>
            <p class="text-gray-500 text-sm mt-1 font-medium">MM PUTRA MOTOR</p>
        </div>

        <form id="form-login" onsubmit="prosesLogin(event)">
            <div class="mb-8">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">ID Karyawan</label>
                <input type="text" id="input-id-karyawan" class="w-full p-4 bg-gray-50 luxury-input rounded-xl text-sm font-bold text-gray-700 uppercase" required placeholder="Masukkan ID Anda (Contoh: MM-001)">
            </div>

            <div class="mb-5 bg-amber-50 border-l-4 border-amber-500 rounded-xl p-4 flex items-start gap-3">
                <i class="fas fa-exclamation-triangle text-amber-500 text-xl mt-0.5 shrink-0"></i>
                <p class="text-amber-800 text-xs font-bold leading-relaxed uppercase tracking-wide">
                    HARAP VERIFIKASI WAJAH. BILA WAJAH / MUKA TIDAK TERDETEKSI MAKA SISTEM TIDAK AKAN MENDETEKSI KEHADIRAN (DIANGGAP TIDAK HADIR / ABSEN).
                </p>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-sky-800 to-sky-600 hover:from-sky-900 hover:to-sky-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-sky-500/30 transition-transform transform hover:-translate-y-1 flex justify-center items-center gap-3">
                <i class="fas fa-sign-in-alt"></i> MASUK
            </button>
        </form>
    </div>

    <!-- HALAMAN ABSENSI -->
    <div id="attendance-section" class="bg-white rounded-3xl luxury-border p-6 md:p-10 w-full max-w-xl shadow-2xl hidden-view relative overflow-hidden">

        <div class="text-center mb-8 border-b border-sky-100 pb-6">
            <div class="flex justify-center mb-4">
                <img src="https://cdn.phototourl.com/free/2026-07-21-6b299418-311e-4ffb-bc13-ad766cd8455a.png" alt="Logo Perusahaan" class="h-20 w-auto object-contain drop-shadow-md">
            </div>
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-900 to-sky-600">ABSENSI HARIAN</h2>
            <p class="text-gray-500 text-sm mt-1 font-medium" id="txt-tanggal-hari-ini"></p>
        </div>

        <form id="form-absensi" onsubmit="event.preventDefault(); simpanDataAbsensi();">
            <input type="hidden" id="abs-id-karyawan">

            <div class="mb-5">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Nama Lengkap Karyawan</label>
                <input type="text" id="abs-nama" class="w-full p-3.5 bg-gray-50 luxury-input rounded-xl text-sm font-bold text-gray-700 uppercase" required placeholder="Memuat nama..." readonly>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Status</label>
                    <div class="relative">
                        <select id="abs-status" class="w-full pl-4 pr-10 py-3.5 bg-gray-50 luxury-input rounded-xl appearance-none font-medium text-gray-700" required>
                            <option value="" disabled selected>-- Pilih --</option>
                            <option value="Hadir">Hadir di Kantor</option>
                            <option value="Kunjungan">Dinas Luar / Kunjungan</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Izin">Izin</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-sky-500">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Titik Lokasi GPS</label>
                    <div class="flex gap-2">
                        <input type="text" id="abs-lokasi" class="w-full p-3.5 bg-gray-100 border border-gray-200 rounded-xl text-sm font-mono focus:outline-none text-gray-500" readonly placeholder="Mencari otomatis...">
                        <button type="button" onclick="ambilLokasiGPS()" class="bg-sky-50 hover:bg-sky-100 text-sky-600 px-5 rounded-xl transition-colors border border-sky-200 flex items-center justify-center shrink-0" title="Muat ulang GPS">
                            <i class="fas fa-map-marker-alt text-xl"></i>
                        </button>
                    </div>
                    <input type="hidden" id="abs-lat">
                    <input type="hidden" id="abs-lng">
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Foto Selfi (Wajib)</label>
                <!-- capture="user" = otomatis membuka kamera depan HP saat tombol ini ditekan di perangkat mobile -->
                <input type="file" id="abs-fotoselfi" accept="image/*" capture="user" class="w-full p-3 bg-gray-50 luxury-input rounded-xl text-sm font-medium text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100" required>
            </div>

            <div class="mb-8">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Keterangan Tambahan</label>
                <textarea id="abs-ket" class="w-full p-4 bg-gray-50 luxury-input rounded-xl resize-none font-medium text-gray-700" rows="2" placeholder="Jika sakit/izin berikan keterangan..."></textarea>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-sky-800 to-sky-600 hover:from-sky-900 hover:to-sky-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-sky-500/30 transition-transform transform hover:-translate-y-1 flex justify-center items-center gap-3">
                <i class="fas fa-paper-plane"></i> KIRIM ABSENSI SEKARANG
            </button>
        </form>

        <div id="status-message" class="hidden-view mt-6 p-4 rounded-xl text-center font-bold text-sm"></div>

    </div>

    <script>
        // =====================================================================
        // KONFIGURASI PENTING
        // Tempel URL Web App hasil deploy Google Apps Script Anda di sini.
        // Cara dapatkan: buka project Apps Script -> Deploy -> New deployment
        // -> Type: Web app -> Execute as: Me -> Who has access: Anyone
        // -> Deploy -> salin URL yang berakhiran /exec
        // =====================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbz04WDKww-7lE4cD2ELxQdzRAjcji1EipKCnI8VgQqXYurNNejp1b4_M_raIDqRrlk99Q/exec";

        // Set Tanggal Otomatis
        const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('txt-tanggal-hari-ini').textContent = new Date().toLocaleDateString('id-ID', opsi);

        function cekKonfigurasi() {
            if (!API_URL || API_URL.indexOf('GANTI_DENGAN') !== -1) {
                alert("API_URL belum diisi. Buka file index.html, ganti nilai API_URL dengan URL Web App Apps Script Anda.");
                return false;
            }
            return true;
        }

        // --- FUNGSI LOGIN / TRANSISI HALAMAN ---
        function prosesLogin(event) {
            event.preventDefault();
            if (!cekKonfigurasi()) return;

            const idKaryawan = document.getElementById('input-id-karyawan').value.trim().toUpperCase();
            if (!idKaryawan) return;

            document.getElementById('loading-overlay').classList.remove('hidden-view');
            document.getElementById('loading-text').textContent = "MEMVERIFIKASI ID...";

            const url = API_URL + "?action=verifikasi&id=" + encodeURIComponent(idKaryawan);

            fetch(url)
                .then(res => res.json())
                .then(response => {
                    document.getElementById('loading-overlay').classList.add('hidden-view');
                    document.getElementById('loading-text').textContent = "MEMPROSES DATA...";

                    if (response.status === 'success') {
                        document.getElementById('abs-id-karyawan').value = idKaryawan;

                        const inputNama = document.getElementById('abs-nama');
                        inputNama.value = response.nama;
                        inputNama.setAttribute('readonly', true);
                        inputNama.classList.add('bg-gray-200', 'cursor-not-allowed');

                        document.getElementById('login-section').classList.add('hidden-view');
                        const attSection = document.getElementById('attendance-section');
                        attSection.classList.remove('hidden-view');
                        attSection.classList.add('fade-in');

                        ambilLokasiGPS();
                    } else {
                        alert(response.message);
                    }
                })
                .catch(error => {
                    document.getElementById('loading-overlay').classList.add('hidden-view');
                    document.getElementById('loading-text').textContent = "MEMPROSES DATA...";
                    alert("Terjadi kesalahan sistem: " + error.message);
                });
        }

        // --- FUNGSI ABSENSI ---
        function ambilLokasiGPS() {
            const inLat = document.getElementById('abs-lat');
            const inLng = document.getElementById('abs-lng');
            const display = document.getElementById('abs-lokasi');

            display.value = "Mencari satelit...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        inLat.value = pos.coords.latitude;
                        inLng.value = pos.coords.longitude;
                        display.value = `📍 ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                    },
                    function(err) {
                        display.value = "";
                        alert("Gagal mengambil lokasi otomatis. Mohon pastikan fitur GPS diaktifkan dan berikan izin pada browser, lalu tekan tombol ikon lokasi.");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("Browser tidak mendukung GPS.");
            }
        }

        function simpanDataAbsensi() {
            if (!cekKonfigurasi()) return;

            const idKaryawan = document.getElementById('abs-id-karyawan').value;
            const status = document.getElementById('abs-status').value;
            const lat = document.getElementById('abs-lat').value;
            const lng = document.getElementById('abs-lng').value;
            const ket = document.getElementById('abs-ket').value;
            const nama = document.getElementById('abs-nama').value;
            const fileInput = document.getElementById('abs-fotoselfi');

            if ((status === 'Hadir' || status === 'Kunjungan') && (!lat || !lng)) {
                alert("Untuk status Hadir/Kunjungan, Anda WAJIB memiliki titik lokasi (GPS). Mohon izinkan akses lokasi atau tekan tombol titik lokasi.");
                return;
            }

            document.getElementById('loading-overlay').classList.remove('hidden-view');
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;

            const payload = {
                waktu: new Date().toLocaleString('id-ID'),
                id_karyawan: idKaryawan,
                nama: nama,
                status: status,
                keterangan: ket,
                lat: lat || "-",
                lng: lng || "-",
                fotoSelfi: ""
            };

            const kirimData = () => {
                // Content-Type text/plain sengaja dipakai agar browser TIDAK
                // mengirim preflight OPTIONS (Apps Script tidak mendukungnya).
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveAbsensi', payload: payload })
                })
                    .then(res => res.json())
                    .then(res => {
                        document.getElementById('loading-overlay').classList.add('hidden-view');
                        const msgBox = document.getElementById('status-message');
                        msgBox.classList.remove('hidden-view');

                        if (res.status === 'success') {
                            msgBox.className = "mt-6 p-4 rounded-xl text-center font-bold text-sm bg-green-50 text-green-700 border border-green-200";
                            msgBox.innerHTML = `<i class="fas fa-check-circle mr-2"></i> ${res.message}`;

                            document.getElementById('form-absensi').reset();
                            document.getElementById('abs-nama').value = payload.nama;
                            document.getElementById('abs-lokasi').value = '';
                        } else {
                            msgBox.className = "mt-6 p-4 rounded-xl text-center font-bold text-sm bg-red-50 text-red-700 border border-red-200";
                            msgBox.innerHTML = `<i class="fas fa-times-circle mr-2"></i> ${res.message}`;
                        }
                        btnSubmit.disabled = false;
                    })
                    .catch(err => {
                        document.getElementById('loading-overlay').classList.add('hidden-view');
                        alert("Terjadi kesalahan: " + err.message);
                        btnSubmit.disabled = false;
                    });
            };

            if (fileInput && fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 800;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        payload.fotoSelfi = canvas.toDataURL('image/jpeg', 0.7);
                        kirimData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                kirimData();
            }
        }
    </script>
</body>
</html>
